<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Search</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <nav>
      <p>Luxe</p>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#flights">Flights</a></li>
        <li><a href="#hotels">Hotels</a></li>
      </ul>
    </nav>
    <div>
      <button>Sign Up</button>
      <button>Log In</button>
    </div>
  </header>
  
  <main class="hero">
    <div class="hero-copy">
      <p class="eyebrow">Travel starts here</p>
      <h1>Flight & hotel search in one place</h1>
      <p>Compare real-time options, convert prices to NGN instantly, and save your favourites.</p>
    </div>

    <section class="search-panel">
      <form id="searchForm">
        <div class="fields-row">
          <div class="field-group">
            <label for="from">From</label>
            <input placeholder="LOS" type="text" id="from" required maxlength="3" />
          </div>
          <div class="field-group">
            <label for="to">To</label>
            <input placeholder="LHR" type="text" id="to" required maxlength="3" />
          </div>
          <div class="field-group">
            <label for="date">Flight date</label>
            <input type="date" id="date" required />
          </div>
        </div>

        <div class="fields-row">
          <div class="field-group">
            <label for="cityCode">Hotel city</label>
            <input placeholder="PAR" type="text" id="cityCode" required maxlength="3" />
          </div>
          <div class="field-group">
            <label for="checkIn">Check in</label>
            <input type="date" id="checkIn" required />
          </div>
          <div class="field-group">
            <label for="checkOut">Check out</label>
            <input type="date" id="checkOut" required />
          </div>
        </div>

        <div class="actions">
          <div class="field-group small">
            <label for="passengers">Passengers</label>
            <input type="number" id="passengers" min="1" max="10" value="1" required />
          </div>
          <div class="field-group small">
            <label for="flightSort">Flight sort</label>
            <select id="flightSort">
              <option value="">Default</option>
              <option value="price">Price (NGN)</option>
              <option value="duration">Duration</option>
            </select>
          </div>
          <div class="field-group small">
            <label for="stops">Max stops</label>
            <select id="stops">
              <option value="">Any</option>
              <option value="0">Non-stop</option>
              <option value="1">1 stop</option>
              <option value="2">2+ stops</option>
            </select>
          </div>
          <button type="submit" class="primary-btn">Search options</button>
        </div>
      </form>
    </section>
  </main>

  <section class="results-section">
    <div id="status" class="status"></div>
    <div class="results-group">
      <h2>Flights</h2>
      <div id="flightControls" class="controls"></div>
      <div id="flightResults" class="results-grid"></div>
    </div>
    <div class="results-group">
      <h2>Hotels</h2>
      <div id="hotelControls" class="controls"></div>
      <div id="hotelResults" class="results-grid"></div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
