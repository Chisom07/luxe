<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Luxe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <header>
    <nav>
      <a class="brand" href="/">Luxe</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#flights">Flights</a></li>
        <li><a href="/#hotels">Hotels</a></li>
      </ul>
    </nav>
    <div class="header-actions" data-auth-actions>
      <a class="ghost-link" href="/login.html">Log in</a>
      <a class="header-btn" href="/signup.html">Sign up</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Create account</p>
      <h1>Join Luxe and start planning smarter.</h1>
      <p class="auth-lead">Save trips, search flights and hotels, and keep everything in one place.</p>

      <form id="signupForm" class="auth-form">
        <div class="field-group">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" placeholder="Ada Okoro" required minlength="2" autocomplete="name">
        </div>
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field-group">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
        </div>
        <div id="authStatus" class="auth-status" hidden></div>
        <button class="primary-btn auth-submit" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>

  <footer class="site-footer auth-footer">
    <div class="footer-bottom">
      <p>© 2026 Luxe Travel</p>
      <p><a href="/#hotels">Popular hotels</a> · <a href="/#flights">Popular flights</a></p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
